# Sealed Secrets controller (multi-source: upstream chart + our values).
# Lives in kube-system: kubeseal looks for `sealed-secrets-controller` there by
# default, and Kyverno policy 05 doesn't generate a default-deny for it.
# The sealing key is NOT generated here — `make sealing-key-install` brings our
# own (BYO) key, so every SealedSecret in git decrypts on a rebuilt cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Before the AI zones and their secrets (wave 0).
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # The project moved from the bitnami-labs to the bitnami GitHub org; the old
    # bitnami-labs.github.io Helm repo URL now returns 404.
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $sag/values/sealed-secrets.yaml
    - repoURL: https://github.com/teodorio95-portofolio/secure-ai-gateway.git
      targetRevision: HEAD
      ref: sag
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
