# Every SealedSecret of the AI stack (written by `make seal-secrets`).
# Plain directory source: the files are already namespaced, encrypted manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-secrets
  namespace: argocd
  annotations:
    # Same wave as the zones that own the target namespaces; the retry below
    # covers the window where a namespace or the SealedSecret CRD isn't there yet
    # (waves order the apply of child Applications, not their readiness).
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/teodorio95-portofolio/secure-ai-gateway.git
    targetRevision: HEAD
    path: secrets/sealed
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The SealedSecret CRD comes from the sealed-secrets app (wave -1).
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
