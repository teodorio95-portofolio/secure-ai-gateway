# Falco rules for the AI agent zone. Append to `customRules.custom-rules.yaml`
# in runtime-security's falco/values.yaml (that repo owns Falco; this one only
# ships the rules). The existing "Suspicious tool executed in container" rule
# already fires for a shell in ai-agents; these two are AI-specific.
#
# ⚠️ On Colima + k3d Falco loads rules but captures no syscalls (documented in
# runtime-security), so these are verified on a real Linux node only.

- rule: Unexpected process in AI agent pod
  desc: >
    The demo agent and the MCP server only ever run Python. Anything else in
    ai-agents (a shell, curl, a package manager) means the agent or one of its
    tools was hijacked — e.g. by a prompt injection that reached code execution.
  condition: >
    spawned_process and container
    and k8s.ns.name = "ai-agents"
    and not proc.name in (python, python3)
  output: >
    Unexpected process in AI agent pod (proc=%proc.name cmdline=%proc.cmdline
    parent=%proc.pname image=%container.image.repository pod=%k8s.pod.name)
  priority: WARNING
  tags: [container, ai, mitre_execution, T1059]

- rule: Credential read by AI agent
  desc: >
    Agents have no ServiceAccount token and only their own virtual key (as an
    env var). Any read under /var/run/secrets or /run/secrets from ai-agents is
    an attempt to find credentials to pivot with.
  condition: >
    open_read and container
    and k8s.ns.name = "ai-agents"
    and (fd.name startswith /var/run/secrets/ or fd.name startswith /run/secrets/)
  output: >
    Credential path read in AI agent pod (file=%fd.name proc=%proc.name
    image=%container.image.repository pod=%k8s.pod.name)
  priority: WARNING
  tags: [filesystem, ai, mitre_credential_access, T1552]
