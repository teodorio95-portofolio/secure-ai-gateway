# Bootstrap for the gateway, rendered through the upstream chart's
# extraResources: teams with budgets/limits, and the virtual keys (the demo
# agent's, plus the family's Hermes keys on the homelab).
# Separate file from values/litellm.yaml only for readability; both are
# valueFiles of gitops/litellm.yaml.
#
# Runs as an ArgoCD PostSync hook (after the proxy is healthy), on every sync.
# Idempotent: it looks each team/key up before creating it. Keys are never
# printed. To re-run by hand: `make gateway-bootstrap`.
extraResources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: litellm-bootstrap
      labels:
        app.kubernetes.io/name: litellm-bootstrap
        app.kubernetes.io/part-of: secure-ai-gateway
    data:
      # -- Teams: per-team budget (USD over budget_duration), token and request
      # rate limits, and the model aliases each team may use.
      teams.json: |
        [
          {"team_alias": "team-payments", "max_budget": 5.0, "budget_duration": "30d",
           "tpm_limit": 20000, "rpm_limit": 30, "models": ["default", "cheap", "local"]},
          {"team_alias": "team-support", "max_budget": 1.0, "budget_duration": "30d",
           "tpm_limit": 5000, "rpm_limit": 10, "models": ["cheap", "local"]}
        ]
      # -- Virtual keys: `secret_env` names the Job env var holding the key's
      # value (from a SealedSecret); a key whose Secret is absent is skipped, so
      # the lab registers only the demo agent. `team_alias` is optional.
      # teodor / teodora (homelab, Hermes in ai-hermes): their own GPT and DeepSeek
      # aliases + `local` only. Their $5 GPT + $5 DeepSeek monthly budget is
      # on the aliases (values/litellm-homelab.yaml) so it falls back when spent;
      # max_budget here is only a runaway ceiling that counts `local` too.
      keys.json: |
        [
          {"key_alias": "demo-agent", "team_alias": "team-support", "secret_env": "AGENT_KEY",
           "models": ["cheap", "local"], "max_budget": 0.5, "rpm_limit": 10},
          {"key_alias": "teodor", "secret_env": "TEODOR_KEY",
           "models": ["chat-teodor-gpt", "chat-teodor", "chat-teodor-pro", "local"], "max_budget": 15.0, "budget_duration": "30d",
           "rpm_limit": 30},
          {"key_alias": "teodora", "secret_env": "TEODORA_KEY",
           "models": ["chat-teodora-gpt", "chat-teodora", "chat-teodora-pro", "local"], "max_budget": 15.0, "budget_duration": "30d",
           "rpm_limit": 30}
        ]
      bootstrap.py: |
        """Create the gateway's teams and register the virtual keys."""
        import json, os, sys, time, urllib.error, urllib.parse, urllib.request

        BASE = os.environ["LITELLM_URL"]
        MASTER = os.environ["LITELLM_MASTER_KEY"]
        CONF = "/bootstrap"

        def call(method, path, body=None, ok=(200,)):
            req = urllib.request.Request(
                BASE + path, method=method,
                data=json.dumps(body).encode() if body is not None else None,
                headers={"Authorization": f"Bearer {MASTER}", "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    return r.status, json.loads(r.read() or b"null")
            except urllib.error.HTTPError as e:
                if e.code in ok:
                    return e.code, None
                raise SystemExit(f"{method} {path} -> HTTP {e.code}: {e.read()[:300]!r}")

        # Wait for the proxy (PostSync already waits for health, this covers restarts).
        for _ in range(60):
            try:
                if call("GET", "/health/readiness")[0] == 200:
                    break
            except (urllib.error.URLError, OSError):
                pass
            time.sleep(5)
        else:
            sys.exit("LiteLLM never became ready")

        teams = {t["team_alias"]: t["team_id"] for t in call("GET", "/team/list")[1] or []}
        for team in json.load(open(f"{CONF}/teams.json")):
            alias = team["team_alias"]
            if alias in teams:
                call("POST", "/team/update", {"team_id": teams[alias], **team})
                print(f"team {alias}: exists, limits updated")
            else:
                teams[alias] = call("POST", "/team/new", team)[1]["team_id"]
                print(f"team {alias}: created")

        for spec in json.load(open(f"{CONF}/keys.json")):
            value = os.environ.get(spec.pop("secret_env"), "")
            alias = spec["key_alias"]
            if not value:
                print(f"key {alias}: no Secret here, skipped")
                continue
            if "team_alias" in spec:
                spec["team_id"] = teams[spec.pop("team_alias")]
            q = urllib.parse.urlencode({"key": value})
            status, _ = call("GET", f"/key/info?{q}", ok=(200, 400, 404))
            if status == 200:
                call("POST", "/key/update", {"key": value, **spec})
                print(f"key {alias}: exists, limits updated")
            else:
                call("POST", "/key/generate", {"key": value, **spec})
                print(f"key {alias}: registered")
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: litellm-bootstrap
      labels:
        app.kubernetes.io/name: litellm-bootstrap
        app.kubernetes.io/part-of: secure-ai-gateway
      annotations:
        argocd.argoproj.io/hook: PostSync
        # Keep the last run (and its logs) until the next sync replaces it.
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-bootstrap
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              # The proxy's own image: Python is already there, no extra pull.
              image: ghcr.io/berriai/litellm-non_root:v1.106.2@sha256:07fabea33dfc2b127e865c03112dfc76936334b29028ec05cdd355af2385dc04
              imagePullPolicy: IfNotPresent
              command: ["python", "/bootstrap/bootstrap.py"]
              env:
                - name: LITELLM_URL
                  value: http://litellm:4000
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-masterkey
                      key: masterkey
                - name: AGENT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: agent-virtual-key
                      key: api-key
                # Homelab only (WITH_HERMES=1 make seal-secrets); absent in the lab.
                - name: TEODOR_KEY
                  valueFrom:
                    secretKeyRef:
                      name: family-virtual-keys
                      key: teodor
                      optional: true
                - name: TEODORA_KEY
                  valueFrom:
                    secretKeyRef:
                      name: family-virtual-keys
                      key: teodora
                      optional: true
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
          volumes:
            - name: bootstrap
              configMap:
                name: litellm-bootstrap
