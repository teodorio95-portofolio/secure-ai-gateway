# Our values for the upstream sealed-secrets chart (gitops/sealed-secrets.yaml).
# The chart is already secure by default (non-root uid 1001, read-only root FS,
# drop ALL, seccomp RuntimeDefault); we only add what the lab's Kyverno
# guardrails require and pin the key behaviour for the BYO sealing key.

# -- Name the Deployment/Service `sealed-secrets-controller` in kube-system, which
# is what `kubeseal` looks for by default (no --controller-name needed).
fullnameOverride: sealed-secrets-controller

image:
  # -- Pinned controller image (amd64 + arm64). Keep in step with the chart's appVersion.
  registry: docker.io
  repository: bitnami/sealed-secrets-controller
  tag: 0.40.0

# -- Disable automatic key rotation. The BYO key from `make sealing-key` is the
# only sealing key, so the committed cert (secrets/sealing-cert.pem) stays valid
# and a rebuilt cluster can decrypt what's already in git.
keyrenewperiod: "0"

# -- Required by Kyverno policy 03 (limits on every container).
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# The chart sets runAsNonRoot on the container only; Kyverno policy 02 checks
# the pod-level securityContext, so repeat it here.
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
