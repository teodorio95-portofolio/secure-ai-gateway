---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: phoenix-secret
  namespace: ai-observability
spec:
  encryptedData:
    PHOENIX_ADMIN_SECRET: 
    PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: 
    PHOENIX_POSTGRES_PASSWORD: 
    PHOENIX_SECRET: 
    PHOENIX_SMTP_PASSWORD: 
  template:
    metadata:
      name: phoenix-secret
      namespace: ai-observability
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: phoenix-api-key
  namespace: ai-gateway
spec:
  encryptedData:
    PHOENIX_API_KEY: 
  template:
    metadata:
      name: phoenix-api-key
      namespace: ai-gateway
