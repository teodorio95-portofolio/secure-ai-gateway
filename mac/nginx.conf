# TCP passthrough to each person's Hermes dashboard (mac/compose.yaml `edge`).
# Stream, not http: nothing to rewrite, and streaming replies pass untouched.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    # Docker's embedded DNS: re-resolve if a Hermes container is recreated.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 19119;
        set $hermes_teodor hermes-teodor:9119;
        proxy_pass $hermes_teodor;
    }

    server {
        listen 19120;
        set $hermes_teodora hermes-teodora:9119;
        proxy_pass $hermes_teodora;
    }
}
