# VALIDATE (Audit): an AI agent pod may reference exactly one Secret — its own
# virtual key: `agent-virtual-key`, or for a family Hermes pod (homelab,
# ai-hermes) `hermes-<its ai.user label>`, so one person's pod cannot mount the
# other's key or dashboard login. Provider keys, the gateway master key or any other credential in
# an agent's environment is what a prompt injection would exfiltrate first.
# Allowlist, not blocklist: a newly added secret is denied by default.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ai-agent-secrets-allowlist
  annotations:
    policies.kyverno.io/title: AI agents only get their own virtual key
    policies.kyverno.io/category: AI Platform
spec:
  background: true
  rules:
    - name: only-agent-virtual-key
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  ai.role: agent
      validate:
        failureAction: Audit
        message: >-
          Pods labelled ai.role=agent may only reference the Secret
          'agent-virtual-key', or 'hermes-<ai.user label>' for a Hermes pod
          (env, envFrom or volumes).
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.[containers, initContainers][][].env[].valueFrom.secretKeyRef.name || `[]` }}"
                operator: AnyNotIn
                value:
                  - agent-virtual-key
                  - "hermes-{{ request.object.metadata.labels.\"ai.user\" || 'none' }}"
              - key: "{{ request.object.spec.[containers, initContainers][][].envFrom[].secretRef.name || `[]` }}"
                operator: AnyNotIn
                value:
                  - agent-virtual-key
                  - "hermes-{{ request.object.metadata.labels.\"ai.user\" || 'none' }}"
              - key: "{{ request.object.spec.volumes[].secret.secretName || `[]` }}"
                operator: AnyNotIn
                value:
                  - agent-virtual-key
                  - "hermes-{{ request.object.metadata.labels.\"ai.user\" || 'none' }}"
