namespace:
  # -- Create the namespace as part of the chart (carries the PSA labels).
  create: true
  name: ai-observability
  podSecurity:
    # -- Pod Security Standard enforced on the namespace.
    enforce: restricted
    # -- PSS level only warned about (not enforced).
    warn: restricted

networkPolicy:
  # -- Ship a default-deny (ingress + egress) policy with the chart. Explicit
  # allows are added on top as CiliumNetworkPolicies.
  enabled: true

phoenix:
  # -- Pod label of the Phoenix pods (upstream chart: `app: phoenix`).
  podLabel: phoenix
  # -- HTTP port: UI, API and OTLP/HTTP trace ingest.
  port: 6006

gateway:
  # -- Namespace whose LiteLLM pods may send traces.
  namespace: ai-gateway
