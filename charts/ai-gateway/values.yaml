namespace:
  # -- Create the namespace as part of the chart (carries the PSA labels).
  create: true
  name: ai-gateway
  podSecurity:
    # -- Pod Security Standard enforced on the namespace.
    enforce: restricted
    # -- PSS level only warned about (not enforced).
    warn: restricted

networkPolicy:
  # -- Ship a default-deny (ingress + egress) policy with the chart. Explicit
  # allows are added on top as CiliumNetworkPolicies.
  enabled: true

litellm:
  # -- `app.kubernetes.io/name` of the LiteLLM pods (proxy + migrations Job),
  # i.e. the upstream chart's name; the network policies select on it.
  name: litellm
  # -- Proxy port.
  port: 4000
  # -- Provider APIs the gateway may reach on 443 (Cilium FQDN allowlist).
  # Everything else on the internet stays blocked.
  providerFQDNs:
    - api.anthropic.com
    - api.openai.com

models:
  # -- Where Ollama runs (ai-models zone) and its port.
  namespace: ai-models
  port: 11434

postgres:
  # -- Run our own Postgres for LiteLLM (instead of the chart's bitnamilegacy subchart).
  enabled: true
  # -- Official image, pinned by tag + digest (multi-arch index).
  image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
  # -- Database LiteLLM uses (must match db.database in values/litellm.yaml).
  database: litellm
  # -- Secret with `username` / `password` keys (sealed in secrets/sealed/).
  credentialsSecret: litellm-postgres
  # -- PVC size for the data directory.
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
