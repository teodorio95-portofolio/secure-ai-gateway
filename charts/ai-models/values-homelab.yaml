# Homelab overrides for the ai-models chart (gitops-homelab/ai-models.yaml),
# layered on top of values.yaml. The mini PC (Ryzen 5 7640HS, 32 GB) can serve a
# bigger model than the laptop's k3d lab.

ollama:
  # -- Built on the homelab itself (amd64) by `make homelab-images` and imported
  # into k3s's containerd; never pulled from a registry.
  image: localhost/secure-ai-gateway/ollama:0.40.8-qwen3.5-4b
  # -- Model tag inside the image (LiteLLM's `local` alias in
  # values/litellm-homelab.yaml points at it).
  model: qwen3.5:4b
  # -- ~3 GB of weights + KV cache. The CPU limit leaves the other ~half of the
  # 12 threads to the rest of the cluster while a generation runs.
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "6"
      memory: 8Gi
