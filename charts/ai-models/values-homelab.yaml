# Homelab overrides for the ai-models chart (gitops-homelab/ai-models.yaml),
# layered on top of values.yaml. The mini PC (Ryzen 5 7640HS, 32 GB) can serve a
# bigger model than the laptop's k3d lab.

ollama:
  # -- Built on the homelab itself (amd64) by `make homelab-images` and imported
  # into k3s's containerd; never pulled from a registry.
  # VULKAN=1 build: Vulkan backend + Mesa RADV for the Radeon 760M.
  image: localhost/secure-ai-gateway/ollama:0.40.8-qwen3.5-9b-vulkan
  # -- Model tag inside the image (LiteLLM's `local` alias in
  # values/litellm-homelab.yaml points at it).
  model: qwen3.5:9b
  # -- Weights (~6 GB) and KV cache live in the iGPU's 8 GB UMA carve-out
  # (BIOS), outside this cgroup; memory here covers the runtime, the mmap'd
  # model file during load and a CPU fallback for layers that don't fit.
  # The CPU limit leaves ~half of the 12 threads to the rest of the cluster.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "6"
      memory: 12Gi
  gpu:
    enabled: true
