# gitleaks config: the default rules, plus one narrow allowlist for SealedSecret
# ciphertext. Values under encryptedData are RSA-OAEP + AES-GCM blobs that only
# the in-cluster controller's private key can open, but their entropy trips
# generic-api-key. Only lines shaped like that ciphertext are allowed (not a
# path), so a plain Secret dropped into secrets/sealed/ by mistake is still
# reported — tested with a planted canary.
[extend]
useDefault = true

[[allowlists]]
description = "SealedSecret ciphertext (encryptedData values)"
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_.-]+: Ag[A-Za-z0-9+/]{500,}={0,2}$''']
